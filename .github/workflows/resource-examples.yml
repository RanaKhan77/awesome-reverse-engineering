name: Reproduce resource examples

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/priority-candidates.*'
      - 'examples/resource-intake/**'
      - '.github/workflows/resource-examples.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/priority-candidates.*'
      - 'examples/resource-intake/**'
      - '.github/workflows/resource-examples.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check prerequisite diagnostics
        run: python -m unittest discover -s tests -p test_resource_prerequisites.py -v
      - name: Install pinned example dependencies
        run: python -m pip install -r examples/resource-intake/requirements.txt
      - name: Reproduce the bounded examples
        run: python examples/resource-intake/verify.py --output "$RUNNER_TEMP/resource-intake"
      - name: Upload reproduction results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resource-intake-evidence
          path: ${{ runner.temp }}/resource-intake/
          if-no-files-found: warn
          retention-days: 30
